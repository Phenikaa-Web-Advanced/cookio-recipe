services:
  db:
    image: mariadb:10.6
    container_name: webnangcao_cooking_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cookio_db
    ports:
      - "3308:3306"
    volumes:
      - ./sql/cookio_db.sql:/docker-entrypoint-initdb.d/01_cookio_db.sql:ro
      - webnangcao_cooking_db_data:/var/lib/mysql

  web:
    build: .
    container_name: webnangcao_cooking_web
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      DB_HOST: "db;port=3306"
      DB_NAME: "cookio_db"
      DB_USER: "root"
      DB_PASS: ""
      BASE_URL: ""
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  webnangcao_cooking_db_data:
